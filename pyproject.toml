[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spdng"
version = "0.3.0"
description = "A maintained speedtest CLI with mtr-style path analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["speedtest", "bandwidth", "traceroute", "mtr", "cli", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.scripts]
spdng = "spdng.cli:main"

[project.urls]
Homepage = "https://github.com/patpadgett/spdng"
Repository = "https://github.com/patpadgett/spdng"
Issues = "https://github.com/patpadgett/spdng/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["spdng*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
