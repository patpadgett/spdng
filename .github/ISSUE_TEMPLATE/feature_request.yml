name: Feature request
description: Something the tool could do that it does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What were you trying to do? Describe the situation rather than
        the solution, if you can. The solution is often not obvious
        from the problem.
      placeholder: |
        I want to know whether my link is slow to the internet or slow
        to my provider, and the current output does not tell me.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you use now instead
      description: If there is an existing tool that does this, say which.
